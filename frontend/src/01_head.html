/* app-specific rules */
:root{ --h0:#059669; --h1:#d97706; --h2:#f97316; --h3:#dc2626; --h4:#86198f; }

  *{-webkit-font-smoothing:antialiased}
  body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}
  .num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  #map path.dist{stroke:#fff;stroke-width:.4;vector-effect:non-scaling-stroke;transition:fill .4s ease,fill-opacity .4s ease;cursor:pointer}
  #map path.dist.sel{stroke:#0f172a;stroke-width:1.6}
  #map path.state{fill:none;stroke:#94a3b8;stroke-width:.6;vector-effect:non-scaling-stroke;opacity:.6;pointer-events:none}
  #map .cell,#map .quake{pointer-events:none}
  #map.drag{cursor:grabbing}
  #map{cursor:grab}
  .maptip{position:absolute;pointer-events:none;z-index:30;background:#0f172a;color:#f1f5f9;border-radius:10px;
    padding:8px 10px;font-size:11.5px;max-width:230px;opacity:0;transition:opacity .1s;box-shadow:0 8px 24px rgba(15,23,42,.25)}
  .maptip.on{opacity:1}
  .maptip b{display:block;font-size:12.5px;margin-bottom:1px}
  .maptip .s{color:#94a3b8;font-size:10.5px;margin-bottom:5px}
  .maptip .v{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#cbd5e1}
  .chip{padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:600;border:1px solid #e2e8f0;background:#f8fafc;color:#475569;white-space:nowrap;transition:all .12s}
  .chip[aria-pressed=true]{background:#047857;border-color:#047857;color:#fff}
  .sevbar{height:5px;border-radius:3px;background:#f1f5f9;overflow:hidden;position:relative}
  .sevbar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
  .track{height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:3px}
  .drawer-scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:opacity .15s;z-index:50}
  .drawer-scrim.on{opacity:1;pointer-events:auto}
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .15s}
  .modal.on{opacity:1;pointer-events:auto}
  .modal .panel{transform:scale(.97);transition:transform .15s}
  .modal.on .panel{transform:none}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:#0f172a;color:#f8fafc;
    border-radius:10px;padding:10px 16px;box-shadow:0 8px 24px rgba(15,23,42,.3);font-size:12.5px;z-index:90;
    opacity:0;pointer-events:none;transition:all .2s;max-width:88vw}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%);background-size:400% 100%;animation:sk 1.4s infinite}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
  @media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
  input[type=range]{accent-color:#047857}
</style>
